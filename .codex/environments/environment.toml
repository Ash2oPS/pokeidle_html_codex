version = 1
name = "pokeidle_html_codex"

[setup]
script = "npm ci"

[[actions]]
name = "Run Game"
icon = "run"
command = "cmd /c .\\launch_game_serve_3000.bat"

[[actions]]
name = "Run Game Live"
icon = "run"
command = "cmd /c .\\launch_game_live_server_3000.bat"

[[actions]]
name = "Run Desktop"
icon = "run"
command = "npm run desktop:start"

[[actions]]
name = "Test"
icon = "run"
command = "npm run test"

[[actions]]
name = "UI Gallery Desktop"
icon = "run"
command = "npm run test:visual:gallery:desktop"

[[actions]]
name = "UI Gallery Mobile"
icon = "run"
command = "npm run test:visual:gallery:mobile"

[[actions]]
name = "Background Matrix"
icon = "run"
command = "npm run test:background:matrix"

[[actions]]
name = "Maintenance Preview"
icon = "run"
command = "npm run test:visual:maintenance"

[[actions]]
name = "Route Tool"
icon = "run"
command = "cmd /c .\\launch_route_encounter_tool.bat"

[[actions]]
name = "Talents Tool"
icon = "run"
command = "cmd /c .\\launch_talents_tool.bat"

[[actions]]
name = "Skin Tool"
icon = "run"
command = "cmd /c .\\launch_custom_skin_tool.bat"
