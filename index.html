<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poke Idle Fan Game</title>
    <link rel="icon" type="image/png" href="assets/icons/pokeball-dock.png" />
    <style>
      #runtime-ui-root > .loading-screen.is-visible {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #000;
        background:
          radial-gradient(circle at 20% 0%, rgba(123, 201, 219, 0.16), transparent 34%),
          radial-gradient(circle at 80% 100%, rgba(246, 205, 117, 0.1), transparent 28%),
          linear-gradient(180deg, rgba(6, 22, 35, 0.98), rgba(3, 11, 18, 1));
        color: #eef7ff;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      #runtime-ui-root > .loading-screen.is-visible .loading-screen-core {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        gap: 14px;
        width: min(520px, calc(100vw - 28px));
        padding: clamp(20px, 3.2vw, 30px);
        border: 1px solid rgba(123, 201, 219, 0.38);
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(18, 47, 72, 0.94), rgba(8, 23, 37, 0.98)),
          linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0) 52%);
        box-shadow:
          0 24px 56px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 -1px 0 rgba(0, 0, 0, 0.24);
        text-align: center;
      }

      #runtime-ui-root > .loading-screen.is-visible .loading-screen-text {
        margin: 0;
        max-width: min(90vw, 42ch);
        color: #e9f5ff;
        font: 700 clamp(14px, 2vw, 23px) / 1.34 "Trebuchet MS", "Verdana", sans-serif;
        letter-spacing: 0.03em;
        text-wrap: balance;
      }

      #runtime-ui-root > .loading-screen.is-visible .loading-pokeball {
        width: clamp(72px, 11vw, 124px);
        aspect-ratio: 1 / 1;
        border-radius: 999px;
        border: clamp(4px, 0.56vw, 7px) solid #fff;
        background:
          linear-gradient(
            180deg,
            rgba(255, 112, 112, 1) 0%,
            rgba(223, 56, 56, 1) 45%,
            rgba(0, 0, 0, 1) 45%,
            rgba(0, 0, 0, 1) 55%,
            rgba(255, 255, 255, 1) 55%,
            rgba(239, 239, 239, 1) 100%
          );
        box-shadow:
          0 0 0 clamp(2px, 0.32vw, 4px) rgba(0, 0, 0, 0.95),
          0 0 32px rgba(255, 255, 255, 0.26);
        position: relative;
        animation: loading-pokeball-spin 1.02s linear infinite;
      }

      #runtime-ui-root > .loading-screen.is-visible .loading-pokeball::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(24px, 3.6vw, 38px);
        height: clamp(24px, 3.6vw, 38px);
        transform: translate(-50%, -50%);
        border-radius: 999px;
        border: clamp(4px, 0.52vw, 6px) solid #000;
        background: #fff;
      }

      #runtime-ui-root > .loading-screen.is-visible .loading-pokeball::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(10px, 1.3vw, 16px);
        height: clamp(10px, 1.3vw, 16px);
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background: #000;
      }

      #runtime-ui-root > .loading-screen.is-visible .loading-screen-flash {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.72);
        background:
          radial-gradient(circle at 50% 48%, rgba(123, 201, 219, 0.2) 0%, rgba(123, 201, 219, 0) 42%),
          radial-gradient(circle at 50% 50%, rgba(246, 205, 117, 0.14) 0%, rgba(246, 205, 117, 0) 62%);
      }

      #runtime-ui-root > .loading-screen.is-visible.maintenance-screen .loading-pokeball {
        animation: maintenance-pokeball-glow 2.5s ease-in-out infinite;
        filter: grayscale(1) brightness(1.08) contrast(1.04);
        opacity: 0.6;
        box-shadow:
          0 0 0 clamp(2px, 0.24vw, 3px) rgba(4, 14, 22, 0.9),
          0 0 20px rgba(216, 226, 255, 0.24),
          0 0 42px rgba(216, 226, 255, 0.2);
      }

      #runtime-ui-root > .loading-screen.is-visible.maintenance-screen .loading-screen-text {
        white-space: pre-line;
      }

      @keyframes loading-pokeball-spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes maintenance-pokeball-glow {
        0%,
        100% {
          transform: scale(1);
          box-shadow:
            0 0 0 clamp(2px, 0.24vw, 3px) rgba(4, 14, 22, 0.9),
            0 0 16px rgba(216, 226, 255, 0.2),
            0 0 32px rgba(216, 226, 255, 0.16);
        }

        50% {
          transform: scale(1.05);
          box-shadow:
            0 0 0 clamp(2px, 0.24vw, 3px) rgba(4, 14, 22, 0.9),
            0 0 28px rgba(230, 238, 255, 0.34),
            0 0 58px rgba(230, 238, 255, 0.24);
        }
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="runtime-ui-root" aria-live="polite">
      <section id="loading-screen" class="loading-screen is-visible" aria-live="polite" aria-label="Chargement">
        <div class="loading-screen-core">
          <div class="loading-pokeball" aria-hidden="true"></div>
          <p id="loading-screen-text" class="loading-screen-text">
            Le code de ce jeu a &eacute;t&eacute; enti&egrave;rement g&eacute;n&eacute;r&eacute; par IA.
          </p>
        </div>
        <div class="loading-screen-flash" aria-hidden="true"></div>
      </section>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
